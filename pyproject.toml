[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentrouter"
version = "0.1.0"
description = "Latent communication router for offline multimodal model routing."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "torch>=2.2",
]

[project.optional-dependencies]
hf = [
  "datasets>=3.3",
  "huggingface-hub>=0.27",
]
vision = [
  "open-clip-torch>=2.26",
  "Pillow>=10.0",
]
dev = [
  "pytest>=8.3",
]

[project.scripts]
latentrouter = "latentrouter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
