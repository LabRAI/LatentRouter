[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latentrouter"
version = "1.0.0"
description = "LatentRouter: Can We Choose the Right Multimodal Large Language Model Before Seeing Its Answer?"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xueqi Cheng"}, {name = "Yushun Dong"}]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.5",
  "torch>=2.2",
]

[project.optional-dependencies]
features = [
  "open-clip-torch>=2.24",
  "Pillow>=10.0",
  "tqdm>=4.66",
  "transformers>=4.40,<5",
]
dev = [
  "pytest>=8.3",
]

[project.scripts]
latentrouter = "latentrouter.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
